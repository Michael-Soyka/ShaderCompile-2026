name: Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --parallel --config Release

      - name: Stage
        shell: pwsh
        run: |
          $stage = 'staging'
          Copy-Item -Recurse scripts $stage
          New-Item -ItemType Directory -Force "$stage/bin" | Out-Null
          Copy-Item build/Release/*.exe, build/Release/*.dll "$stage/bin"
          Copy-Item dxc/*.txt "$stage/bin"

      - uses: actions/upload-artifact@v4
        with:
          name: ShaderCompile-${{ github.run_number }}
          path: staging

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $last = git ls-remote --tags --refs origin 'shadecmp26-*' |
            ForEach-Object { [version]( $_ -replace '^.*refs/tags/shadecmp26-', '' ) } |
            Sort-Object | Select-Object -Last 1
          $version = if ( $last ) { "$($last.Major).$($last.Minor + 1)" } else { '1.1' }
          $tag = "shadecmp26-$version"
          $archive = "ShaderCompile26-$version.7z"
          7z a $archive ./staging/*
          gh release create $tag $archive staging/bin/ShaderCompile26.exe --target ${{ github.sha }} --title $tag --generate-notes
