name: Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --parallel --config Release

      - name: Stage
        shell: pwsh
        run: |
          $stage = 'staging'
          Copy-Item -Recurse scripts $stage
          New-Item -ItemType Directory -Force "$stage/bin" | Out-Null
          Copy-Item build/Release/*.exe, build/Release/*.dll "$stage/bin"
          Copy-Item dxc/*.txt "$stage/bin"

      - uses: actions/upload-artifact@v4
        with:
          name: ShaderCompile-${{ github.run_number }}
          path: staging

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build_${{ github.run_number }}"
          $archive = "ShaderCompile${{ github.run_number }}.7z"
          7z a $archive ./staging/*
          gh release create $tag $archive staging/bin/ShaderCompile26.exe --target ${{ github.sha }} --title $tag --generate-notes
